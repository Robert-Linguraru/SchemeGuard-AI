services:
  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Set the Supabase JDBC URL in .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set the Supabase database user in .env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set the Supabase database password in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      ML_SERVICE_URL: http://ml:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CURRENCY_RATES_ENABLED: ${CURRENCY_RATES_ENABLED:-true}
      CURRENCY_RATES_CRON: ${CURRENCY_RATES_CRON:-0 0 18 * * MON-FRI}
      CURRENCY_RATES_ZONE: ${CURRENCY_RATES_ZONE:-Europe/Bucharest}
      CURRENCY_RATES_CURRENCIES: ${CURRENCY_RATES_CURRENCIES:-EUR,RON,USD,GBP,CHF}
      CURRENCY_RATES_REFRESH_ON_STARTUP: ${CURRENCY_RATES_REFRESH_ON_STARTUP:-true}
    ports:
      - "8080:8080"
    depends_on:
      ml:
        condition: service_started

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  ml:
    build:
      context: ./ML
    ports:
      - "8000:8000"

volumes:
  frontend_node_modules:
