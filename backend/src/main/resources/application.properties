spring.application.name=backend

app.currency-rates.enabled=${CURRENCY_RATES_ENABLED:true}
app.currency-rates.cron=${CURRENCY_RATES_CRON:0 0 18 * * MON-FRI}
app.currency-rates.zone=${CURRENCY_RATES_ZONE:Europe/Bucharest}
app.currency-rates.currencies=${CURRENCY_RATES_CURRENCIES:EUR,RON,USD,GBP,CHF}
app.currency-rates.refresh-on-startup=${CURRENCY_RATES_REFRESH_ON_STARTUP:true}

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration=900000

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}


app.upload.storage-directory=${UPLOAD_STORAGE_DIRECTORY:/tmp/schemeguard-transaction-uploads}
app.upload.chunk-size-bytes=${UPLOAD_CHUNK_SIZE_BYTES:16777216}
app.upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE_BYTES:536870912}
app.upload.max-parts=${UPLOAD_MAX_PARTS:64}
app.upload.max-parallel-uploads=${UPLOAD_MAX_PARALLEL_UPLOADS:4}
app.upload.max-parallel-imports=${UPLOAD_MAX_PARALLEL_IMPORTS:2}
app.upload.api-requests-per-minute=${UPLOAD_API_REQUESTS_PER_MINUTE:120}
app.upload.chunk-uploads-per-minute=${UPLOAD_CHUNK_UPLOADS_PER_MINUTE:240}
app.upload.session-ttl-hours=${UPLOAD_SESSION_TTL_HOURS:24}
app.upload.import-batch-size=${UPLOAD_IMPORT_BATCH_SIZE:5000}
app.upload.progress-update-interval-ms=${UPLOAD_PROGRESS_UPDATE_INTERVAL_MS:2000}
app.upload.cleanup-interval-ms=${UPLOAD_CLEANUP_INTERVAL_MS:3600000}

spring.jpa.properties.hibernate.type.json_format_mapper=org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
app.llm.ollama-url=${OLLAMA_URL:http://host.docker.internal:11434}
app.llm.model=${OLLAMA_MODEL:qwen3:1.7b}
